[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanmask"
version = "0.0.1"
description = "Self-hosted LLM proxy that masks PII before it leaves your network, and restores it in the response. CJK-ready."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
